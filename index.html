<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X2-Limitless</title>
  <style>
    /* === GLOBAL STYLES === */
    :root {
      --accent: #00c8ff;
      --bg: #0a0a0a;
      --text-main: #e6e6e6;
      --text-sub: #c8c8c8;
      --border: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    h1 {
      color: var(--accent);
      margin: 0;
      font-weight: 600;
      font-size: 1.4rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 10px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s, border-bottom 0.3s;
      padding-bottom: 3px;
    }

    nav a:hover,
    nav a.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    main {
      flex: 1;
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.7;
    }

    main h2 {
      color: var(--accent);
      font-size: 2em;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }

    main p {
      font-size: 1.05em;
      color: var(--text-sub);
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #111;
      color: #666;
      border-top: 1px solid var(--border);
      font-size: 0.9em;
    }

    /* === FORMS & BUTTONS === */
    input {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 10px;
      color: #e0e0e0;
      border-radius: 5px;
      width: 100%;
      max-width: 280px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background-color: #009ecc;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      text-align: center;
    }

    .form-container h3 {
      margin-bottom: 10px;
      color: var(--accent);
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .profile img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      filter: grayscale(1);
      border: 2px solid #333;
    }

    a.email-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a.email-link:hover {
      text-decoration: underline;
    }

    hr {
      width: 50%;
      border: 1px solid #333;
    }

    /* === MOBILE RESPONSIVE STUFF === */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 10px;
      }

      nav {
        gap: 15px;
      }

      main {
        padding: 40px 20px;
      }

      main h2 {
        font-size: 1.6em;
      }

      main p {
        font-size: 1em;
      }

      button {
        width: 80%;
        max-width: 250px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }

      main h2 {
        font-size: 1.4em;
      }

      nav a {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>X2-Limitless</h1>
    <nav>
      <a href="#" class="nav-link active" data-page="home">Home</a>
      <a href="#" class="nav-link" data-page="about">About</a>
      <a href="#" class="nav-link" data-page="contact">Contact</a>
      <a href="#" class="nav-link" data-page="account">Account</a>
    </nav>
  </header>

  <main id="content">
    <h2>Welcome</h2>
    <p>
      Welcome to <strong>X2-Limitless</strong> — a digital playground for the
      curious and the chaotic. Step into the unknown. Freedom awaits.
    </p>
  </main>

  <footer>
    <p>© 2025 X2-Limitless. All rights reserved.</p>
  </footer>

  <script>
    const navLinks = document.querySelectorAll(".nav-link");
    const content = document.getElementById("content");

    function getUser() {
      return JSON.parse(localStorage.getItem("x2_user")) || null;
    }

    function saveUser(user) {
      localStorage.setItem("x2_user", JSON.stringify(user));
    }

    function logout() {
      localStorage.removeItem("x2_user");
      showAccountPage();
    }

    navLinks.forEach((link) => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        navLinks.forEach((l) => l.classList.remove("active"));
        link.classList.add("active");
        showPage(link.getAttribute("data-page"));
      });
    });

    function showPage(page) {
      switch (page) {
        case "home":
          content.innerHTML = `
              <h2>Welcome</h2>
              <p>Welcome to <strong>X2-Limitless</strong> — a space for the restless and the dreamers. Where ideas flow and limits fade away.</p>
              <p>Step into the unknown and make something extraordinary.</p>
            `;
          break;

        case "about":
          content.innerHTML = `
              <h2>About</h2>
              <p>Hey there — I'm just a bored creator trying to find meaning in lines of code. I don’t really know what I’m doing, but that’s kind of the fun part, isn’t it?</p>
              <p>X2-Limitless is what happens when curiosity meets confusion — and I just let it happen.</p>
            `;
          break;

        case "contact":
          content.innerHTML = `
              <h2>Contact</h2>
              <p>If you’ve got suggestions, feedback, or just want to say hi, feel free to reach out.</p>
              <p>Email me at <a href="mailto:support@xtwolimitless.com" class="email-link">support@xtwolimitless.com</a></p>
              <p>Don’t be shy — I promise I read every message (eventually).</p>
            `;
          break;

        case "account":
          showAccountPage();
          break;
      }
    }

    function generateID() {
      return Math.floor(1000000000 + Math.random() * 9000000000);
    }

    function showAccountPage() {
      const user = getUser();
      if (user) {
        content.innerHTML = `
            <h2>Profile</h2>
            <div class="profile">
              <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Anonymous" />
              <h3>${user.username}</h3>
              <p>ID: ${user.id}</p>
              <button onclick="logout()">Log Out</button>
            </div>
          `;
      } else {
        content.innerHTML = `
            <h2>Account</h2>
            <div class="form-container">
              <div>
                <h3>Login</h3>
                <input id="login-username" placeholder="Username" /><br />
                <input id="login-password" type="password" placeholder="Password" /><br />
                <button onclick="login()">Login</button>
              </div>
              <hr />
              <div>
                <h3>Register</h3>
                <input id="register-username" placeholder="Username" /><br />
                <input id="register-password" type="password" placeholder="Password" /><br />
                <button onclick="register()">Register</button>
              </div>
            </div>
          `;
      }
    }

    function register() {
      const username = document.getElementById("register-username").value.trim();
      const password = document.getElementById("register-password").value.trim();

      if (!username || !password) {
        alert("Please fill in all fields.");
        return;
      }

      const users = JSON.parse(localStorage.getItem("x2_users")) || [];
      if (users.find((u) => u.username === username)) {
        alert("Username already exists.");
        return;
      }

      const newUser = { username, password, id: generateID() };
      users.push(newUser);
      localStorage.setItem("x2_users", JSON.stringify(users));
      alert("Registration successful! You can now log in.");
    }

    function login() {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();

      const users = JSON.parse(localStorage.getItem("x2_users")) || [];
      const found = users.find((u) => u.username === username && u.password === password);

      if (found) {
        saveUser(found);
        showAccountPage();
      } else {
        alert("Invalid username or password.");
      }
    }

    showPage("home");
  </script>
</body>
</html>
